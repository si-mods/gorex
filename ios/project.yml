# XcodeGen spec: `xcodegen generate` writes GoRex.xcodeproj (not committed).
# Build ios/Frameworks/Tailnet.xcframework first: scripts/build-tailnet.
name: GoRex
packages:
  # si-mods fork of GhosttyKit (Metal renderer, key encoding, and libghostty-vt
  # exported in one static library; docs/IOS-032-merge-ghostty-vt.md).
  GhosttyKit:
    url: https://github.com/si-mods/ghosttykit-rootshell.git
    exactVersion: 0.3.0
options:
  deploymentTarget:
    iOS: "26.0"
  developmentLanguage: en
  # Icon Composer `.icon` folders (AppIcon*.icon) need XcodeGen 2.45.1.
  minimumXcodeGenVersion: 2.45.1
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    MARKETING_VERSION: "1.1"
    # Local builds are (0); uploads count from 1.
    CURRENT_PROJECT_VERSION: "0"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: 57QL6YCAH5
    # The xcframework's simulator library is arm64 only.
    EXCLUDED_ARCHS[sdk=iphonesimulator*]: x86_64
  configs:
    Release:
      SWIFT_OPTIMIZATION_LEVEL: -Osize
      SWIFT_COMPILATION_MODE: wholemodule
      DEAD_CODE_STRIPPING: YES
      GCC_OPTIMIZATION_LEVEL: z
targets:
  GoRex:
    type: application
    platform: iOS
    sources:
      - GoRex
      # What the widgets share with the app: the snapshot, the programs'
      # tiles and the brand marks.
      - Shared
      - path: THIRD_PARTY_NOTICES.md
        buildPhase: resources
      # The desktop app's JetBrains Mono, for the font previews.
      - path: ../assets/fonts/JetBrainsMono-Regular.ttf
        buildPhase: resources
      # Shared Ghostty terminal themes catalog (used by iOS and web).
      - path: ../assets/ghostty-themes.json
        buildPhase: resources
    dependencies:
      # The widgets (docs/IOS-010-widgets.md), embedded in PlugIns.
      - target: GoRexWidgets
      # Built-in Tailscale (ios/tailnet), a static library.
      - framework: Frameworks/Tailnet.xcframework
        embed: false
      - package: GhosttyKit
        product: GhosttyKitAppStore
    settings:
      base:
        OTHER_LDFLAGS: -lc++ -lbz2
        SWIFT_OBJC_BRIDGING_HEADER: GoRex/GoRex-Bridging-Header.h
        PRODUCT_BUNDLE_IDENTIFIER: dev.gorex.ios
        # iCloud key-value store: the settings that sync (CloudSettings).
        # App Group: the widgets' snapshot (WidgetSnapshot).
        CODE_SIGN_ENTITLEMENTS: GoRex/GoRex.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # The icons Settings > App Icon offers besides AppIcon (docs/IOS-009-app-icons.md).
        ASSETCATALOG_COMPILER_ALTERNATE_APPICON_NAMES: AppIcon-Spectrum AppIcon-Classic
        ASSETCATALOG_COMPILER_INCLUDE_ALL_APPICON_ASSETS: YES
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1,2"
        # The short git hash About shows; scripts/upload sets it.
        GOREX_COMMIT: ""
    info:
      path: GoRex/Info.plist
      properties:
        CFBundleDisplayName: Rex Go
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        GoRexCommit: $(GOREX_COMMIT)
        ITSAppUsesNonExemptEncryption: false
        # The terminal's Live Activity (docs/IOS-006-live-activities.md), drawn
        # by GoRexWidgets; pushes through the relay keep it going while the
        # app is suspended (docs/NET-003-push-relay.md).
        NSSupportsLiveActivities: true
        NSSupportsLiveActivitiesFrequentUpdates: true
        UIAppFonts: [JetBrainsMono-Regular.ttf]
        CFBundleLocalizations: [en, zh-Hans]
        UILaunchScreen:
          UIColorName: LaunchBackground
          UIImageName: LaunchIcon
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        # A pointer's clicks come as its own touches, which select.
        UIApplicationSupportsIndirectInputEvents: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        # The local network listener is plain HTTP by design (docs/REF-005-rex-api.md).
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        NSLocalNetworkUsageDescription: Rex Go connects to your computers on the local network.
        NSCameraUsageDescription: Rex Go scans the pairing QR code that GoRex or Rex shows, and takes the photos you send to a terminal.
        # The mic dictates into the terminal (Dictation).
        NSMicrophoneUsageDescription: Rex Go hears what you say while the mic is on, and types it into the terminal. Speech is recognised on this device.
        # A gallery's image saved to Photos from the share sheet.
        NSPhotoLibraryAddUsageDescription: Rex Go saves the images you choose from a terminal's gallery to your photos.
        # A window row's or a host's drag in the list (HostListView's
        # Lifted), which only the app's own drop targets take.
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: dev.gorex.window-row
            UTTypeDescription: Rex Go Window
            UTTypeConformsTo: [public.data]
          - UTTypeIdentifier: dev.gorex.host
            UTTypeDescription: Rex Go Host
            UTTypeConformsTo: [public.data]
        # rexgo://tailcat?a=…&n=…, GoRex's Rex Go QR…, opened from the
        # camera app. The Tailscale login's callback (TailnetEngine) is the
        # same scheme; its session takes that one itself.
        CFBundleURLTypes:
          - CFBundleURLName: dev.gorex.ios
            CFBundleURLSchemes: [rexgo]
  # The Home Screen and Lock Screen widgets (docs/IOS-010-widgets.md). They
  # read the snapshot the app writes to the App Group, and link none of
  # the app's frameworks.
  GoRexWidgets:
    type: app-extension
    platform: iOS
    sources:
      - GoRexWidgets
      - Shared
    dependencies:
      - sdk: SwiftUI.framework
      - sdk: WidgetKit.framework
      # The activity's buttons' intents (Shared/ActivityActions.swift).
      - sdk: AppIntents.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.gorex.ios.widgets
        CODE_SIGN_ENTITLEMENTS: GoRexWidgets/GoRexWidgets.entitlements
        TARGETED_DEVICE_FAMILY: "1,2"
        SKIP_INSTALL: YES
    info:
      path: GoRexWidgets/Info.plist
      properties:
        CFBundleDisplayName: Rex Go
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleLocalizations: [en, zh-Hans]
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
  # Hostless, so that it also runs without xcodebuild:
  # xcrun simctl spawn booted .../xctest GoRexTests.xctest
  GoRexTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - GoRexTests
      - GoRex/Rex
      - GoRex/Push
      - Shared
      - GoRex/WidgetPublisher.swift
      - GoRexWidgets/InboxWidgetView.swift
      - GoRexWidgets/TerminalActivityView.swift
      - GoRex/Terminal/TerminalLive.swift
      - GoRex/BackgroundGrace.swift
      - GoRex/Notifier.swift
      - GoRex/Views/TerminalTarget.swift
      - GoRex/Terminal/VTerminal.swift
      - GoRex/Terminal/KeyEvent.swift
      - GoRex/Terminal/InputDocument.swift
      - GoRex/Terminal/InputTrace.swift
      - GoRex/Terminal/TerminalTheme.swift
      - GoRex/Terminal/TerminalNotifications.swift
      - GoRex/Terminal/TerminalSession.swift
      - GoRex/Terminal/Coalesce.swift
      - GoRex/Terminal/LastDrawn.swift
      - GoRex/Terminal/FDReader.swift
      - GoRex/Terminal/Maple.swift
      - GoRex/Terminal/WebLink.swift
      - GoRex/Terminal/FileLink.swift
      - GoRex/Terminal/HTMLViewer.swift
      - GoRex/Gallery/GalleryScanner.swift
      - GoRex/Gallery/GalleryStore.swift
      - GoRex/Gallery/PaneGallery.swift
      - GoRex/Terminal/Archive.swift
      - GoRex/Terminal/FbankFrontend.swift
      - GoRex/Terminal/QwenTokenizer.swift
      - GoRex/Terminal/CoreMLSileroVAD.swift
      - GoRex/Terminal/CoreMLSenseVoice.swift
      - GoRex/Terminal/ObjCException.m
      - GoRex/Terminal/CoreMLFunASR.swift
      - GoRex/Terminal/Dictation.swift
      - GoRex/Terminal/Polish.swift
      - GoRex/Tailnet/TailnetSettings.swift
      - GoRex/Views/ProgramTile.swift
      - GoRex/Views/AgentHighlightView.swift
      - GoRex/Views/TopAlertPresenter.swift
      - GoRex/Views/Toast.swift
      - GoRex/Share/WebClientSync.swift
      - GoRex/Share/ShareCalls.swift
      - GoRex/Share/ShareHosts.swift
      - path: ../internal/rexapi/testdata/rex-terminal-stream.bin
        buildPhase: resources
    dependencies:
      - package: GhosttyKit
        product: GhosttyKitAppStore
    settings:
      base:
        GENERATE_INFOPLIST_FILE: true
        # An identifier, for its asset catalog (the brand marks) to load.
        PRODUCT_BUNDLE_IDENTIFIER: dev.gorex.ios.tests
        # GhosttyKit needs C++; Archive.swift reads bzip2, as the app does.
        OTHER_LDFLAGS: -lc++ -lbz2
        SWIFT_OBJC_BRIDGING_HEADER: GoRex/GoRex-Bridging-Header.h
  GoRexUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - GoRexUITests
    dependencies:
      - target: GoRex
    settings:
      base:
        GENERATE_INFOPLIST_FILE: true
        SWIFT_DEFAULT_ACTOR_ISOLATION: nonisolated
schemes:
  GoRex:
    build:
      targets:
        GoRex: all
    test:
      targets:
        - GoRexTests
        - GoRexUITests
