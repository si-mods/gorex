# XcodeGen spec: `xcodegen generate` writes GoRex.xcodeproj (not committed).
# Build ios/Frameworks/GhosttyVt.xcframework first: scripts/build-ghostty-vt.sh.
# And ios/Frameworks/Tailnet.xcframework: scripts/build-tailnet.
name: GoRex
packages:
  # rootshell's prebuilt Ghostty (Metal renderer, key encoding), at the
  # version rootshell pins.
  GhosttyKit:
    url: https://github.com/kitknox/ghosttykit-rootshell.git
    exactVersion: 0.2.23
options:
  deploymentTarget:
    iOS: "26.0"
  developmentLanguage: en
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    MARKETING_VERSION: "1.1"
    # Local builds are (0); uploads count from 1.
    CURRENT_PROJECT_VERSION: "0"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: 57QL6YCAH5
    # The xcframework's simulator library is arm64 only.
    EXCLUDED_ARCHS[sdk=iphonesimulator*]: x86_64
targets:
  GoRex:
    type: application
    platform: iOS
    sources:
      - GoRex
      - path: THIRD_PARTY_NOTICES.md
        buildPhase: resources
    dependencies:
      # libghostty-vt reads the snapshot a stream starts with.
      - framework: Frameworks/GhosttyVt.xcframework
        embed: false
      # Built-in Tailscale (ios/tailnet), a static library.
      - framework: Frameworks/Tailnet.xcframework
        embed: false
      - package: GhosttyKit
        product: GhosttyKitAppStore
    settings:
      base:
        OTHER_LDFLAGS: -lc++
        SWIFT_OBJC_BRIDGING_HEADER: GoRex/GoRex-Bridging-Header.h
        PRODUCT_BUNDLE_IDENTIFIER: dev.gorex.ios
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1,2"
        # The short git hash About shows; scripts/upload sets it.
        GOREX_COMMIT: ""
    info:
      path: GoRex/Info.plist
      properties:
        CFBundleDisplayName: Rex Go
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        GoRexCommit: $(GOREX_COMMIT)
        ITSAppUsesNonExemptEncryption: false
        CFBundleLocalizations: [en, zh-Hans]
        UILaunchScreen:
          UIColorName: ""
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        # A pointer's clicks come as its own touches, which select.
        UIApplicationSupportsIndirectInputEvents: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        # The local network listener is plain HTTP by design (docs/rex-api.md).
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        NSLocalNetworkUsageDescription: Rex Go connects to your computers on the local network.
        NSCameraUsageDescription: Rex Go scans the pairing QR code that GoRex or Rex shows.
        # rexgo://tailcat?a=…&n=…, GoRex's Rex Go QR…, opened from the
        # camera app. The Tailscale login's callback (TailnetEngine) is the
        # same scheme; its session takes that one itself.
        CFBundleURLTypes:
          - CFBundleURLName: dev.gorex.ios
            CFBundleURLSchemes: [rexgo]
  # Hostless, so that it also runs without xcodebuild:
  # xcrun simctl spawn booted .../xctest GoRexTests.xctest
  GoRexTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - GoRexTests
      - GoRex/Rex
      - GoRex/Terminal/VTerminal.swift
      - GoRex/Terminal/KeyEvent.swift
      - GoRex/Terminal/InputDocument.swift
      - GoRex/Terminal/TerminalTheme.swift
      - GoRex/Terminal/TerminalSession.swift
      - GoRex/Terminal/Maple.swift
      - GoRex/Terminal/WebLink.swift
      - GoRex/Tailnet/TailnetSettings.swift
      - path: ../internal/rexapi/testdata/rex-terminal-stream.bin
        buildPhase: resources
    dependencies:
      - framework: Frameworks/GhosttyVt.xcframework
        embed: false
    settings:
      base:
        GENERATE_INFOPLIST_FILE: true
schemes:
  GoRex:
    build:
      targets:
        GoRex: all
    test:
      targets:
        - GoRexTests
