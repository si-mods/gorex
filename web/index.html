<!doctype html>

<!-- The app (docs/web-client.md, App): its manifest, iOS's home screen icon and name, and the window's colour, which main.ts keeps to the page's. -->

<style>
  @font-face { font-family: "JetBrains Mono"; src: url("fonts/JetBrainsMono-Regular.ttf") format("truetype"); font-weight: 400; font-style: normal; }
  @font-face { font-family: "JetBrains Mono"; src: url("fonts/JetBrainsMono-Bold.ttf") format("truetype"); font-weight: 700; font-style: normal; }
  @font-face { font-family: "JetBrains Mono"; src: url("fonts/JetBrainsMono-Italic.ttf") format("truetype"); font-weight: 400; font-style: italic; }
  @font-face { font-family: "JetBrains Mono"; src: url("fonts/JetBrainsMono-BoldItalic.ttf") format("truetype"); font-weight: 700; font-style: italic; }
  :root {
    color-scheme: dark;
    --page: #1c1c1e;
    --text: #e8e8ea;
    --muted: #8e8e93;
    --hover: rgba(255, 255, 255, 0.10);
    --pill: rgba(255, 255, 255, 0.16);
    /* The tiles' outer rim, dark on a dark page and light on a light one; the dot of a program done. */
    --tile-rim: rgba(0, 0, 0, 0.7);
    --tile-rim-w: 0.5px;
    --dot-rim: rgba(0, 0, 0, 0.85);
    --done: #7aa0c2;
    --attention: #fbbf24;
    /* The connection's dot (settings.ts): connected, connecting, unreachable; the accent of the chosen section. */
    --ok: #30d158;
    --danger: #ff6b6b;
    --accent: #0a84ff;
    /* The Settings dialog's cards and their hairlines, as the desktop's k.card, k.cardBorder and k.tabSep. */
    --card: rgba(255, 255, 255, 0.06);
    --card-edge: rgba(255, 255, 255, 0.08);
    --sep: rgba(255, 255, 255, 0.10);
    /* The desktop terminals' family (style.go, defaultFontFamily). */
    --mono: "JetBrains Mono", "SF Mono", Menlo, monospace;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    display: grid;
    /* minmax(0, …): no content widens or lengthens the stage past the window, which would move its centre. */
    grid-template-columns: 240px minmax(0, 1fr);
    grid-template-rows: minmax(0, 1fr) auto;
    background: var(--page);
    color: var(--text);
    font: 13px system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  :root { --edge: rgba(255, 255, 255, 0.05); --edge-focus: rgba(255, 255, 255, 0.14); --panel: rgba(44, 44, 48, 0.78); --panel-edge: rgba(255, 255, 255, 0.12); --shadow: rgba(0, 0, 0, 0.25); --shadow-focus: rgba(0, 0, 0, 0.4); }
  /* The light scheme, for a light terminal background or the Window setting (main.ts sets data-scheme). */
  :root[data-scheme="light"] {
    color-scheme: light;
    --page: #ececf0;
    --text: #1c1c1e;
    --muted: #6c6c70;
    --hover: rgba(0, 0, 0, 0.07);
    --pill: rgba(0, 0, 0, 0.12);
    --tile-rim: rgba(255, 255, 255, 0.95);
    --tile-rim-w: 1px;
    --dot-rim: rgba(255, 255, 255, 0.95);
    --attention: #f59e0b;
    --ok: #28a745;
    --danger: #e5484d;
    --accent: #007aff;
    --card: rgba(255, 255, 255, 0.72);
    --card-edge: rgba(0, 0, 0, 0.08);
    --sep: rgba(0, 0, 0, 0.10);
    --edge: rgba(0, 0, 0, 0.10);
    --edge-focus: rgba(0, 0, 0, 0.28);
    --panel: rgba(250, 250, 252, 0.82);
    --panel-edge: rgba(0, 0, 0, 0.12);
    --shadow: rgba(60, 40, 50, 0.07);
    --shadow-focus: rgba(60, 40, 50, 0.12);
  }
  #sessions { grid-row: 1 / 3; display: flex; flex-direction: column; min-height: 0; padding: 12px 8px 8px; position: relative; }
  #list { flex: 1; overflow-y: auto; min-height: 0; }
  #foot { padding-top: 8px; }
  /* The sidebar's Settings button, as the desktop's sidebarSettings. */
  .theme-button {
    display: inline-flex; align-items: center; gap: 6px; padding: 5px 12px; border: 0; border-radius: 999px;
    background: none; color: var(--muted); font: inherit; cursor: pointer;
  }
  .theme-button:hover { background: var(--hover); color: var(--text); }
  /* The host list is a glass panel over the page, as the desktop's popovers: blur 24, radius 16. */
  .theme-panel {
    position: fixed; left: 8px; bottom: 44px; z-index: 10; width: 320px; max-width: calc(100vw - 16px);
    max-height: min(600px, calc(100vh - 64px)); display: flex; flex-direction: column; gap: 8px; padding: 12px;
    border-radius: 16px; background: var(--panel); border: 1px solid var(--panel-edge);
    -webkit-backdrop-filter: blur(24px); backdrop-filter: blur(24px);
    box-shadow: 0 12px 40px rgba(0, 0, 0, 0.35);
  }
  .theme-panel[hidden] { display: none; }
  .theme-preview { padding: 10px 12px; border-radius: 10px; font: 12px/1.3 var(--mono); white-space: pre; overflow: hidden; flex: none; }
  .theme-preview[hidden] { display: none; }
  .theme-filter { display: flex; gap: 2px; padding: 2px; border-radius: 999px; background: var(--hover); flex: none; }
  .theme-filter button { flex: 1; padding: 4px 0; border: 0; border-radius: 999px; background: none; color: var(--text); font: inherit; cursor: pointer; }
  .theme-filter button.on { background: var(--pill); }
  .theme-search {
    flex: none; padding: 6px 12px; border: 1px solid var(--panel-edge); border-radius: 999px;
    background: var(--hover); color: var(--text); font: inherit; outline: none;
  }
  .theme-search:focus { border-color: var(--muted); }
  .theme-list { position: relative; overflow-y: auto; min-height: 120px; }
  .theme-row {
    display: flex; align-items: center; gap: 10px; width: 100%; padding: 5px 8px; border: 0; border-radius: 8px;
    background: none; color: var(--text); font: inherit; text-align: left; cursor: pointer;
  }
  .theme-row:hover, .theme-row:focus-visible { background: var(--hover); outline: none; }
  .theme-swatch {
    display: flex; align-items: center; justify-content: center; gap: 3px; width: 56px; height: 22px; flex: none;
    border-radius: 5px; box-shadow: inset 0 0 0 0.5px var(--panel-edge);
  }
  .theme-swatch i { width: 7px; height: 7px; border-radius: 50%; }
  .theme-swatch.host { color: var(--muted); }
  .theme-swatch.host .pane-icon { width: 16px; height: 16px; }
  .theme-name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .theme-check { display: flex; align-items: center; justify-content: center; width: 1.2em; }
  .theme-check .pane-icon { width: 14px; height: 14px; }
  .theme-empty { padding: 12px; color: var(--muted); text-align: center; }
  #sessions h2 { margin: 12px 8px 4px; font-size: 11px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: 0.04em; }
  #sessions nav { color: var(--muted); }
  #sessions h2 { display: flex; align-items: center; }
  #sessions h2 span { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  button.icon {
    flex: none; width: 22px; height: 22px; padding: 0; border: 0; border-radius: 999px; background: none;
    color: var(--muted); display: flex; align-items: center; justify-content: center; cursor: pointer;
  }
  button.icon .pane-icon { width: 14px; height: 14px; }
  button.icon:hover { background: var(--hover); color: var(--text); }
  /* A window's row: a capsule, as the desktop's sidebar rows, its close button on hover. */
  .window { display: flex; align-items: center; border-radius: 999px; }
  .window:hover { background: var(--hover); }
  .window.open { background: var(--pill); }
  .window .close { visibility: hidden; margin-right: 4px; }
  .window .close .pane-icon { width: 12px; height: 12px; }
  .window:hover .close, .window.open .close { visibility: visible; }
  button.block {
    display: flex; align-items: center; gap: 8px; flex: 1; min-width: 0; padding: 6px 4px 6px 12px; border: 0;
    background: none; color: var(--text); font: inherit; text-align: left;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; cursor: pointer;
  }
  /* The tiles of a window's programs (programs.ts), as the desktop's: 21x16 DIPs, up to two behind the front one. */
  .tiles { position: relative; flex: none; height: 20px; }
  .tile {
    position: absolute; width: 21px; height: 16px; border-radius: 4.5px; background: var(--tile-bg);
    box-shadow: 0 0 0 var(--tile-rim-w) var(--tile-rim), 0 0.5px 1.5px 0 rgba(0, 0, 0, 0.18);
  }
  .tile.bordered { box-shadow: inset 0 0 0 0.5px rgba(0, 0, 0, 0.12), 0 0 0 var(--tile-rim-w) var(--tile-rim), 0 0.5px 1.5px 0 rgba(0, 0, 0, 0.18); }
  /* Lit from above: a sheen along the top that darkens a little to the foot, and a lit inner edge, brightest at the top. */
  .tile::before, .tile::after { content: ""; position: absolute; inset: 0; border-radius: inherit; pointer-events: none; }
  .tile::before { background: linear-gradient(rgba(255, 255, 255, 0.18), rgba(255, 255, 255, 0) 50%, rgba(0, 0, 0, 0.06)); }
  .tile::after {
    padding: 0.5px; background: linear-gradient(rgba(255, 255, 255, 0.45), rgba(255, 255, 255, 0.15));
    -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite: xor;
    mask: linear-gradient(#000 0 0) content-box exclude, linear-gradient(#000 0 0);
  }
  /* The glyph is a mask of the SVG, in the tile's foreground, as a template image. */
  .tile-glyph {
    position: absolute; left: 5px; top: 2.5px; width: 11px; height: 11px; background: var(--tile-fg);
    -webkit-mask: var(--glyph) center / contain no-repeat; mask: var(--glyph) center / contain no-repeat;
  }
  /* The tile of a pane's header, 0.85 of its size as iOS's terminal title has it. */
  .pane-tile { display: flex; flex: none; }
  .pane-tile .tile { position: relative; zoom: 0.85; }
  /* The dot of a program done and not seen, on the tile's corner: lit from above, in a rim. */
  .done-dot {
    position: absolute; right: -1.67px; top: -1.67px; width: 5.67px; height: 5.67px; border-radius: 50%; z-index: 1;
    background: linear-gradient(rgba(255, 255, 255, 0.3), rgba(255, 255, 255, 0) 50%) content-box, linear-gradient(var(--done), var(--done)) content-box, linear-gradient(var(--dot-rim), var(--dot-rim));
    padding: 0.5px;
  }
  .attention-dot { flex: none; width: 7px; height: 7px; margin-right: 6px; border-radius: 50%; background: var(--attention); }
  .progress-ring {
    flex: none; width: 12px; height: 12px; margin-right: 6px; border-radius: 50%;
    background: conic-gradient(var(--muted) calc(var(--p) * 1%), var(--pill) 0);
    -webkit-mask: radial-gradient(circle, transparent 3.5px, #000 4px); mask: radial-gradient(circle, transparent 3.5px, #000 4px);
  }
  button.block .title { min-width: 0; overflow: hidden; text-overflow: ellipsis; }
  button.block .count { margin-left: auto; color: var(--muted); font-size: 11px; }
  /* The window's room: 8px from the window's edges (gap), its panes placed in it by window.ts. */
  #stage { position: relative; margin: 8px 8px 0 0; min-width: 0; min-height: 0; }
  /* A pane as the desktop's: corners concentric with the window's (cardR), a 1px
     border and a shadow, both stronger focused; a header over its terminal. */
  .pane {
    position: absolute; display: flex; flex-direction: column; overflow: hidden; outline: none; border-radius: 8px;
    background: #1e1e22; box-shadow: 0 1px 2px var(--shadow), 0 6px 22px -2px var(--shadow);
  }
  .pane[hidden] { display: none; }
  .pane::after {
    content: ""; position: absolute; inset: 0; border-radius: inherit; pointer-events: none;
    box-shadow: inset 0 0 0 1px var(--edge);
  }
  .pane.focused { box-shadow: 0 1px 2px var(--shadow-focus), 0 6px 22px -2px var(--shadow-focus); }
  .pane.focused::after { box-shadow: inset 0 0 0 1px var(--edge-focus); }
  .pane-head {
    flex: none; display: flex; align-items: center; gap: 6px; height: 33px; padding: 0 8px 0 12px;
    color: var(--text); font-size: 12.5px; font-weight: 600; user-select: none;
  }
  .pane-title { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; opacity: 0.86; }
  .pane.focused .pane-title { opacity: 1; }
  /* As the desktop's paneActions: shown on the focused or hovered pane. */
  .pane-actions { display: flex; gap: 1px; opacity: 0; transition: opacity 0.16s; }
  .pane.focused .pane-actions, .pane:hover .pane-actions { opacity: 1; }
  /* As view.go's iconButton(…, 26, 16): a 26px button, radius 26/2.6, a 16px lucide icon in the muted colour. */
  .pane-action {
    display: grid; place-items: center; width: 26px; height: 26px; padding: 0; border: 0; border-radius: 10px;
    background: none; color: var(--muted); cursor: pointer;
  }
  .pane-action:hover { background: var(--hover); color: var(--text); }
  .pane-icon {
    width: 16px; height: 16px; background: currentColor;
    -webkit-mask: var(--icon) center / contain no-repeat; mask: var(--icon) center / contain no-repeat;
  }
  .pane-action[data-action="split-right"] { --icon: url(icons/columns-2.svg); }
  .pane-action[data-action="split-down"] { --icon: url(icons/rows-2.svg); }
  .pane-action[data-action="zoom"] { --icon: url(icons/maximize-2.svg); }
  .pane.zoomed .pane-action[data-action="zoom"] { --icon: url(icons/minimize-2.svg); }
  .pane-action[data-action="close"] { --icon: url(icons/x.svg); }
  .pane-body { position: relative; flex: 1; min-height: 0; }
  /* The Show pane headers setting off: the terminal takes the whole pane. */
  .no-pane-headers .pane-head { display: none; }
  /* The canvas takes one-finger drags itself (scrolling, a long press's selection, pointer.ts); pinching still zooms. */
  .screen {
    position: absolute; inset: 0; display: block; touch-action: pinch-zoom;
    user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
  }
  /* A selection's handles, as iOS's SelectionHandle: a 2px stem a line high at the outer edge of an end cell,
     a 10px knob above the first or below the last, in the accent colour. Touches near it are its own. */
  .select-handle { position: absolute; z-index: 3; width: 20px; touch-action: none; }
  .select-handle[hidden] { display: none; }
  .select-handle::before { content: ""; position: absolute; left: 9px; width: 2px; background: var(--accent); }
  .select-handle::after { content: ""; position: absolute; left: 5px; width: 10px; height: 10px; border-radius: 50%; background: var(--accent); }
  .select-handle.start::before { top: 5px; bottom: 0; }
  .select-handle.start::after { top: 0; }
  .select-handle.end::before { top: 0; bottom: 5px; }
  .select-handle.end::after { bottom: 0; }
  /* A transparent border widens where a finger takes it by 16px, as iOS's point(inside:), around the same box. */
  .select-handle { box-sizing: content-box; border: 16px solid transparent; margin: -16px; }
  /* The selection's menu, as iOS's edit menu: a small glass panel, as the app's popovers (blur 24), its row concentric. */
  .select-menu {
    position: absolute; z-index: 4; display: flex; padding: 4px; border-radius: 12px;
    background: var(--panel); border: 1px solid var(--panel-edge); color: var(--text);
    -webkit-backdrop-filter: blur(24px); backdrop-filter: blur(24px); box-shadow: 0 12px 40px rgba(0, 0, 0, 0.35);
  }
  .select-menu[hidden] { display: none; }
  .select-menu-item {
    display: flex; align-items: center; gap: 8px; padding: 5px 12px 5px 10px; border: 0; border-radius: 8px;
    background: none; color: var(--text); font: inherit; white-space: nowrap; cursor: pointer;
  }
  .select-menu-item:hover:not(:disabled) { background: var(--hover); }
  .select-menu-item:disabled { color: var(--muted); cursor: default; }
  .select-menu-item .pane-icon { width: 14px; height: 14px; }
  /* A divider: the gap between two panes, a grip on hover, as view.go's divider. */
  .divider { position: absolute; z-index: 1; touch-action: none; }
  .divider.column { cursor: col-resize; }
  .divider.row { cursor: row-resize; }
  .divider::after { content: ""; position: absolute; left: 50%; top: 50%; border-radius: 1.5px; background: var(--muted); opacity: 0; }
  .divider.column::after { width: 3px; height: 36px; transform: translate(-50%, -50%); }
  .divider.row::after { width: 36px; height: 3px; transform: translate(-50%, -50%); }
  .divider:hover::after, .divider.held::after { opacity: 0.6; }
  /* The host list (hosts.ts): the chosen host atop the sidebar, and a glass panel as the theme picker's. */
  #hosts { padding: 0 0 4px; }
  .host-button {
    display: flex; align-items: center; gap: 8px; width: 100%; padding: 7px 12px; border: 0; border-radius: 999px;
    background: none; color: var(--text); font: inherit; font-weight: 600; text-align: left; cursor: pointer;
  }
  .host-button:hover, .host-button[aria-expanded="true"] { background: var(--hover); }
  .host-button[hidden], .host-brand[hidden] { display: none; }
  /* With no host, the app's name in the button's place: not a control. */
  .host-brand { display: flex; align-items: center; gap: 8px; padding: 7px 12px; font-weight: 600; }
  .host-brand img { flex: none; border-radius: 5px; }
  .host-name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .host-chevron { display: flex; color: var(--muted); }
  .host-chevron .pane-icon { width: 14px; height: 14px; }
  .host-panel { top: 52px; bottom: auto; }
  .host-title { padding: 2px 4px 4px; font-weight: 600; }
  .host-row { display: flex; align-items: center; gap: 2px; }
  .host-row .theme-row { flex: 1; min-width: 0; }
  .host-text { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .host-text .theme-name { flex: none; }
  .host-url { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--muted); font-size: 11.5px; }
  .host-form { display: flex; flex-direction: column; gap: 8px; }
  .host-field { display: flex; flex-direction: column; gap: 4px; color: var(--muted); font-size: 12px; }
  .host-field .theme-search { color: var(--text); font-size: 13px; }
  /* The host's icon: a segmented row of the icons. */
  .icon-pick { display: flex; gap: 2px; padding: 2px; align-self: flex-start; border-radius: 999px; background: var(--hover); }
  .icon-choice {
    display: grid; place-items: center; width: 36px; height: 28px; padding: 0; border: 0; border-radius: 999px;
    background: none; color: var(--muted); cursor: pointer;
  }
  .icon-choice:hover { color: var(--text); }
  .icon-choice[aria-checked="true"] { background: var(--pill); color: var(--text); }
  .host-error { color: #ff6b6b; font-size: 12px; }
  .host-error:empty { display: none; }
  .host-note { color: var(--muted); font-size: 12px; }
  .host-buttons { display: flex; gap: 6px; justify-content: flex-end; }
  .host-add {
    padding: 6px 14px; border: 1px solid var(--panel-edge); border-radius: 999px; background: var(--hover);
    color: var(--text); font: inherit; cursor: pointer;
  }
  .host-add:hover { background: var(--pill); }
  .host-add.primary { background: var(--text); color: var(--page); border-color: transparent; }
  .host-add.danger { margin-right: auto; color: #ff6b6b; }
  .command { display: flex; align-items: center; gap: 6px; padding: 6px 6px 6px 12px; border-radius: 10px; background: var(--hover); }
  .command code { flex: 1; min-width: 0; white-space: pre-wrap; overflow-wrap: anywhere; font: 12px/1.5 var(--mono); user-select: all; }
  .command-copy { flex: none; padding: 3px 10px; border: 0; border-radius: 999px; background: var(--pill); color: var(--text); font: inherit; font-size: 12px; cursor: pointer; }
  /* What is wrong with the host, or how to add one, over the empty stage. */
  /* Its child takes margin: auto, centred in the stage both ways, and scrolls rather than spilling past the
     stage's top when it is taller (place-items: center would cut its top off, out of reach). */
  #notice { position: absolute; inset: 0; z-index: 2; display: flex; overflow: auto; padding: 24px; }
  #notice > * { margin: auto; flex: none; }
  #notice[hidden] { display: none; }
  .notice-card {
    display: flex; flex-direction: column; gap: 12px; width: min(520px, 100%); padding: 20px; border-radius: 16px;
    background: var(--panel); border: 1px solid var(--panel-edge); box-shadow: 0 12px 40px rgba(0, 0, 0, 0.25);
  }
  .notice-card h1 { margin: 0; font-size: 17px; }
  .notice-card p { margin: 0; color: var(--muted); line-height: 1.45; overflow-wrap: anywhere; }
  .notice-card .host-add { align-self: flex-start; }
  /* Learn more: the technical why, under a problem's card. */
  .notice-more summary, .welcome-needs summary {
    display: inline-flex; align-items: center; gap: 6px; padding: 2px 4px; margin-left: -4px; border-radius: 6px;
    color: var(--muted); font-size: 12px; cursor: pointer; list-style: none;
  }
  .notice-more summary::-webkit-details-marker, .welcome-needs summary::-webkit-details-marker { display: none; }
  .notice-more summary:hover, .welcome-needs summary:hover { color: var(--text); }
  .notice-more summary:focus-visible, .welcome-needs summary:focus-visible, .welcome-choice:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .notice-more summary .pane-icon, .welcome-needs summary .pane-icon { width: 13px; height: 13px; }
  .notice-more p { margin: 6px 0 0; font-size: 12px; }
  /* The first screen (welcome.ts): the app's icon, what it is, and a card for each way in; no panel of its
     own, it is the page. The recommended way is the primary card: tinted in the accent, as the guide's hero. */
  .welcome { display: flex; flex-direction: column; width: min(480px, 100%); }
  .welcome-home { display: flex; flex-direction: column; align-items: center; text-align: center; }
  .welcome-icon { width: 72px; height: 72px; border-radius: 16px; box-shadow: 0 6px 22px -4px var(--shadow-focus); }
  .welcome-title { margin: 18px 0 0; font-size: 22px; font-weight: 700; letter-spacing: -0.01em; text-wrap: balance; }
  .welcome-text { margin: 8px 0 0; color: var(--muted); font-size: 14px; line-height: 1.45; text-wrap: balance; }
  .welcome-choices { display: flex; flex-direction: column; gap: 10px; align-self: stretch; margin-top: 24px; }

  .ts-link-row { display: flex; flex-wrap: wrap; gap: 8px; }
  .ts-url-note { color: var(--muted); font-size: 12px; }
  .ts-section { display: flex; align-items: center; gap: 10px; margin-top: 4px; }
  .ts-section h3, .ts-empty h3 { margin: 0; font-size: 12px; font-weight: 600; }
  .ts-searching { display: flex; align-items: center; gap: 6px; color: var(--muted); font-size: 12px; }
  .ts-searching .pane-icon { width: 13px; height: 13px; }
  .ts-hosts { display: flex; flex-direction: column; border-radius: 14px; background: var(--card); border: 1px solid var(--card-edge); overflow: hidden; }
  .ts-host { display: flex; flex-direction: column; gap: 8px; padding: 10px 12px; }
  .ts-host + .ts-host { border-top: 1px solid var(--sep); }
  .ts-host-top { display: flex; align-items: center; gap: 10px; }
  .ts-host-why { display: flex; flex-direction: column; gap: 6px; padding: 10px 12px; border-radius: 10px; background: color-mix(in srgb, var(--danger) 8%, transparent); }
  .ts-host-why strong { font-weight: 600; }
  .ts-empty { display: flex; flex-direction: column; gap: 10px; padding: 14px; border-radius: 14px; background: var(--card); border: 1px solid var(--card-edge); }
  .ts-howto { display: flex; flex-direction: column; gap: 10px; margin: 0; padding-left: 20px; }
  .ts-howto li > * + * { margin-top: 6px; }
  .ts-howto li::marker { color: var(--muted); font-weight: 600; }
  .ts-unanswered { color: var(--attention) !important; }
  .ts-note { font-size: 12px; }
  @media (max-width: 640px) {
    body { grid-template-columns: minmax(0, 1fr); grid-template-rows: auto 1fr auto; }
    #sessions { grid-row: auto; max-height: 36vh; }
    #stage { margin: 0 8px; }
    /* Settings fills the screen; the sections go in a row above the page. */
    dialog.settings { width: 100vw; height: 100dvh; border: 0; border-radius: 0; }
    dialog.settings[open] { grid-template-columns: minmax(0, 1fr); grid-template-rows: auto minmax(0, 1fr); }
    .settings-nav {
      flex-direction: row; align-items: center; overflow-x: auto; overflow-y: hidden; padding: 10px 16px;
      border-right: 0; border-bottom: 1px solid var(--sep); scrollbar-width: none;
    }
    .settings-host { margin: 0 6px 0 0; max-width: 200px; }
    .settings-head { padding: 0 6px 0 16px; }
    .settings-scroll { padding: 4px 16px 16px; }
    .settings-line { flex-wrap: wrap; row-gap: 8px; }
    .settings-control { flex-wrap: wrap; }
    /* The viewer fills the screen too; its name keeps the head's room. */
    dialog.viewer { width: 100vw; height: 100dvh; border: 0; border-radius: 0; }
    .viewer-head { padding-left: 12px; }
    .viewer-info, .viewer-zoom { display: none; }
    /* The guide is a sheet over the whole screen, 16px from its edges. */
    dialog.ts-guide { width: 100vw; height: 100dvh; min-height: 0; max-height: none; }
    .ts-head { padding-left: 16px; }
    .ts-steps { padding: 4px 16px 12px; }
    .ts-steps li { flex-direction: column; gap: 4px; font-size: 11px; }
    .ts-steps li + li::before { display: none; }
    .ts-body { padding: 16px; }
    .ts-foot { padding: 12px 16px calc(16px + env(safe-area-inset-bottom)); }
    .ts-foot .host-add { flex: 1; }
    .notice-actions .host-add { flex: 1 1 auto; }
    /* The welcome and the cards take the screen's width less 16px each side: the overlay reaches past the
       stage's 8px margins to the screen's edges, so that it clips a card's shadow only there. */
    #notice { inset: 0 -8px; padding: 16px; }
    .welcome-title { font-size: 20px; }
    .update { left: 8px; right: 8px; bottom: calc(28px + env(safe-area-inset-bottom)); max-width: none; }
    .chunk-loads { left: 8px; right: 8px; bottom: calc(28px + env(safe-area-inset-bottom)); width: auto; }
  }
</style>
</head>
<body>
<aside id="sessions"><div id="hosts"></div><div id="list"></div><div id="foot"><button type="button" class="theme-button" id="open-settings"></button></div></aside>
<main id="stage"><div id="notice" hidden></div><div id="boot" hidden></div></main>
<footer id="status"></footer>
<script type="module" src="app.js"></script>
</body>
</html>
