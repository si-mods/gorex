name: TestFlight

# Archives Rex Go and uploads it to TestFlight, as ios/scripts/upload does on
# a Mac: the build number is App Store Connect's last one for the version,
# plus one. Uploads queue, so that each takes its own number.
on:
  workflow_dispatch:
  push:
    branches: [main, ci/ios-testflight]
    paths:
      - ios/**
      - internal/rexapi/**
      - .github/workflows/testflight.yml

permissions:
  contents: read

concurrency:
  group: testflight
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  upload:
    runs-on: macos-26
    env:
      ASC_KEY_ID: 6GG554C43Y
      ASC_ISSUER_ID: 1b9ef96d-c5b4-49a9-8c8d-4f0b999da4d6
    steps:
      - uses: actions/checkout@v4
      # The deployment target is iOS 26.
      - run: sudo xcode-select -s /Applications/Xcode_26.6.app
      - run: brew install asc xcodegen
      # The script pins Ghostty's commit and Zig's version.
      - uses: actions/cache@v4
        id: ghostty-vt
        with:
          path: ios/Frameworks/GhosttyVt.xcframework
          key: ghostty-vt-${{ hashFiles('ios/scripts/build-ghostty-vt.sh') }}
      - if: steps.ghostty-vt.outputs.cache-hit != 'true'
        run: ios/scripts/build-ghostty-vt.sh
      - name: upload
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          export ASC_KEY_PATH="$RUNNER_TEMP/AuthKey_$ASC_KEY_ID.p8"
          (umask 077; printf '%s\n' "$ASC_KEY_P8" > "$ASC_KEY_PATH")
          ios/scripts/upload | tee "$RUNNER_TEMP/upload.log"
          sed -n 's/^UPLOADED /Uploaded Rex Go /p' "$RUNNER_TEMP/upload.log" >> "$GITHUB_STEP_SUMMARY"
      - if: always()
        run: rm -f "$RUNNER_TEMP"/AuthKey_*.p8
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-logs
          path: ios/build/*.log
          if-no-files-found: ignore
