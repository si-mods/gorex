name: TestFlight

# Archives Rex Go and uploads it to TestFlight, as ios/scripts/upload does on
# a Mac: the build number is App Store Connect's last one for the version,
# plus one. Runs never overlap; a newer pending run replaces an older one,
# which is fine, as it has the older one's commits too.
on:
  workflow_dispatch:
  push:
    branches: [main]
    # Only the app's changes, with the Go its built-in Tailscale builds
    # from; a change to this file alone uploads nothing (start it by hand
    # to try one).
    paths:
      - ios/**
      - go.mod
      - go.sum
      - internal/tailnode/**

permissions:
  contents: read
  actions: read # the last upload's commit, for What to Test

concurrency:
  group: testflight
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  upload:
    if: github.ref == 'refs/heads/main'
    # The Mac mini's own runner (~/actions-runner-gorex): GitHub's arm64
    # macOS runners went hours without capacity, and its Intel ones are slow.
    runs-on: gorex-testflight
    steps:
      # The history, for What to Test.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # The deployment target is iOS 26: the newest Xcode_26*, as GitHub's
      # images name them, else the Mac's own; DEVELOPER_DIR, as xcode-select
      # needs sudo.
      - run: |
          shopt -s nullglob
          x=$(printf '%s\n' /Applications/Xcode_26*.app | sort -V | tail -1)
          [[ -z $x ]] || echo "DEVELOPER_DIR=$x/Contents/Developer" >> "$GITHUB_ENV"
      - run: xcodebuild -version
      - run: for t in asc xcodegen; do command -v "$t" >/dev/null || brew install "$t"; done
      # The script pins Ghostty's commit and Zig's version.
      - uses: actions/cache/restore@v4
        id: ghostty-vt
        with:
          path: ios/Frameworks/GhosttyVt.xcframework
          key: ghostty-vt-${{ hashFiles('ios/scripts/build-ghostty-vt.sh') }}
      - if: steps.ghostty-vt.outputs.cache-hit != 'true'
        run: ios/scripts/build-ghostty-vt.sh
      - if: steps.ghostty-vt.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ios/Frameworks/GhosttyVt.xcframework
          key: ${{ steps.ghostty-vt.outputs.cache-primary-key }}
      # Built-in Tailscale (ios/tailnet), with the Go and gomobile go.mod pins.
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/cache/restore@v4
        id: tailnet
        with:
          path: ios/Frameworks/Tailnet.xcframework
          key: tailnet-${{ hashFiles('go.mod', 'go.sum', 'ios/tailnet/**', 'internal/tailnode/**', 'ios/scripts/build-tailnet') }}
      - if: steps.tailnet.outputs.cache-hit != 'true'
        run: ios/scripts/build-tailnet
      - if: steps.tailnet.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ios/Frameworks/Tailnet.xcframework
          key: ${{ steps.tailnet.outputs.cache-primary-key }}
      - name: upload
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          GH_TOKEN: ${{ github.token }}
        run: |
          [[ -n $ASC_KEY_P8 ]] || { echo "::error::The ASC_KEY_P8 secret is empty: set it to the App Store Connect API key (.p8)"; exit 1; }
          export ASC_KEY_PATH="$RUNNER_TEMP/AuthKey.p8"
          (umask 077; printf '%s\n' "$ASC_KEY_P8" > "$ASC_KEY_PATH")
          ios/scripts/upload | tee "$RUNNER_TEMP/upload.log"
          sed -n 's/^UPLOADED /Uploaded Rex Go /p' "$RUNNER_TEMP/upload.log" >> "$GITHUB_STEP_SUMMARY"
          # What to Test: the app's commits since the last run that uploaded.
          # Notes that fail leave the upload as it is.
          read -r V B < <(sed -n 's/^UPLOADED \([0-9.]*\) (\([0-9]*\))$/\1 \2/p' "$RUNNER_TEMP/upload.log") || true
          FROM=$(gh run list -R "$GITHUB_REPOSITORY" --workflow testflight.yml --branch main --status success -L 1 --json headSha -q '.[0].headSha' || true)
          ios/scripts/test-notes "${V:-}" "${B:-}" "${FROM:-HEAD~1}" || echo "::warning::What to Test was not set for ${V:-?} (${B:-?})"
      - if: always()
        run: rm -f "$RUNNER_TEMP/AuthKey.p8"
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-logs
          path: ios/build/*.log
          if-no-files-found: ignore
