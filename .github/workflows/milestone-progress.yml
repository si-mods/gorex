name: Milestone progress

# A merged PR checks the roadmap items it completed: its body names the
# issue and milestone, and lists the checked items copied from it.
#
#   Progress: #35 M0
#   - [x] Introduce a stable action registry ...
#
# pull_request_target gives the workflow a write token for pull requests
# from forks. PR events check out the base commit, not the PR; the push
# run after a merge runs the merged commit, as any workflow on main does.

on:
  pull_request_target:
    types: [closed]
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      pr:
        description: Merged pull request number
        required: true
        type: string

permissions:
  contents: read
  issues: write
  pull-requests: read

concurrency:
  group: milestone-progress
  cancel-in-progress: false

env:
  # The only issue this workflow edits. A PR cannot point it elsewhere.
  ROADMAP_ISSUE: "35"

jobs:
  update:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'push' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.base.sha || github.sha }}
          persist-credentials: false
      - uses: actions/github-script@v7
        with:
          script: |
            const path = require('path');
            const file = path.join(process.env.GITHUB_WORKSPACE, '.github/scripts/milestone-progress.cjs');
            let mod;
            try {
              mod = require(file);
            } catch (err) {
              if (context.eventName === 'pull_request_target') {
                core.info('The base commit has no progress script yet; skipping.');
                return;
              }
              throw err;
            }
            if (typeof mod.update !== 'function') {
              throw new Error('milestone-progress.cjs does not export update');
            }
            await mod.update({ github, context, core });
