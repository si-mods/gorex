name: Release

# Builds and signs every platform's app of mygo.json's version and uploads
# them to that version's draft GitHub release, on si-mods' own runners: no
# job runs on GitHub's. The Mac mini builds the Unix apps, whose archives
# keep the executable bit that a Windows file system loses; YIBO-PC builds
# the Windows apps, with the NSIS installer. The two builds run in parallel.
# "draft" creates the draft release before them, so that they do not both
# create it. "checksums" writes the release's SHA256SUMS from its assets
# after them, so that they do not both rewrite it; the SHA256SUMS that each
# build uploads is replaced.
on:
  workflow_dispatch:
    inputs:
      target:
        description: What to build
        type: choice
        options: [all, unix, windows, web]
        default: all

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # Creates the draft release, which the builds upload to, if there is none.
  # On the runner of the build that runs: a Windows-only release does not
  # wait for the Mac mini.
  draft:
    if: github.ref == 'refs/heads/main' && (inputs.target == 'all' || inputs.target == 'unix' || inputs.target == 'windows')
    runs-on: ${{ inputs.target == 'windows' && fromJSON('["self-hosted","yibo-pc"]') || fromJSON('["self-hosted","macmini"]') }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - if: runner.os != 'Windows'
        run: .github/scripts/draft-release.sh
        env:
          GH_TOKEN: ${{ github.token }}
      # PowerShell reads mygo.json, as the runner may have no jq; Git Bash
      # runs the script: a bare bash on Windows can be WSL's.
      - if: runner.os == 'Windows'
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $m = Get-Content mygo.json -Raw | ConvertFrom-Json
          $env:VERSION = $m.version
          $env:REPO = $m.updates.github
          & "C:\Program Files\Git\bin\bash.exe" .github/scripts/draft-release.sh
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  unix:
    needs: draft
    if: github.ref == 'refs/heads/main' && (inputs.target == 'all' || inputs.target == 'unix')
    runs-on: [self-hosted, macmini]
    timeout-minutes: 60
    steps:
      # -upload uploads with gh.
      - run: gh --version
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          # The runner keeps Go's caches between runs.
          cache: false
      # A keychain of the run's own holds the Developer ID that mygo.json's
      # signingIdentity names, and the notary credentials: the App Store
      # Connect API key that TestFlight uploads use. mygo then notarizes the
      # disk image, so Gatekeeper opens the app, and macOS keeps its privacy
      # answers across updates, as the signature stays the same.
      - name: signing keychain
        env:
          P12: ${{ secrets.MACOS_DEVELOPER_ID_P12 }}
          P12_PASSWORD: ${{ secrets.MACOS_DEVELOPER_ID_P12_PASSWORD }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          [[ -n $P12 && -n $P12_PASSWORD && -n $ASC_KEY_P8 ]] || { echo "::error::Set MACOS_DEVELOPER_ID_P12 (base64), MACOS_DEVELOPER_ID_P12_PASSWORD and ASC_KEY_P8"; exit 1; }
          kc="$RUNNER_TEMP/signing.keychain-db" pw=$(uuidgen)
          security create-keychain -p "$pw" "$kc"
          security set-keychain-settings -lut 21600 "$kc"
          security unlock-keychain -p "$pw" "$kc"
          (umask 077; printf '%s' "$P12" | base64 -D > "$RUNNER_TEMP/id.p12"; printf '%s\n' "$ASC_KEY_P8" > "$RUNNER_TEMP/AuthKey.p8")
          security import "$RUNNER_TEMP/id.p12" -k "$kc" -P "$P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$pw" "$kc" >/dev/null
          security list-keychains -d user -s "$kc" $(security list-keychains -d user | tr -d '"')
          xcrun notarytool store-credentials gorex-notary --keychain "$kc" \
            --key "$RUNNER_TEMP/AuthKey.p8" --key-id 6GG554C43Y --issuer 1b9ef96d-c5b4-49a9-8c8d-4f0b999da4d6
          rm -f "$RUNNER_TEMP/id.p12" "$RUNNER_TEMP/AuthKey.p8"
          jq --arg kc "$kc" '.macos.notarize = {keychainProfile: "gorex-notary", keychain: $kc}' mygo.json > "$RUNNER_TEMP/mygo.json"
          mv "$RUNNER_TEMP/mygo.json" mygo.json
      - name: build and upload
        env:
          MYGO_UPDATER_PRIVATE_KEY: ${{ secrets.MYGO_UPDATER_PRIVATE_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: go tool mygo build -platform darwin/arm64,linux/amd64,linux/arm64 -upload
      - if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/id.p12" "$RUNNER_TEMP/AuthKey.p8"

  windows:
    needs: draft
    if: github.ref == 'refs/heads/main' && (inputs.target == 'all' || inputs.target == 'windows')
    runs-on: [self-hosted, yibo-pc]
    timeout-minutes: 60
    steps:
      - run: gh --version
      # Keep LF in the files the app embeds, as the other platforms do.
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          # The runner keeps Go's caches between runs.
          cache: false
      # PowerShell: a bare bash on Windows can be WSL's.
      - name: build and upload
        shell: powershell
        env:
          MYGO_UPDATER_PRIVATE_KEY: ${{ secrets.MYGO_UPDATER_PRIVATE_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: go tool mygo build -platform windows/amd64,windows/arm64 -upload

  # Writes SHA256SUMS from the release's assets once a build is done and none
  # failed. A build that the target skips does not count. It needs only gh, jq
  # and sha256sum, so it runs on an instabox machine, not the Mac mini: a
  # Windows-only release does not wait for it. Not on a GitHub-hosted runner:
  # si-mods runs none, and a job there stays queued (0.37.0's did).
  checksums:
    needs: [unix, windows]
    if: always() && github.ref == 'refs/heads/main' && contains(needs.*.result, 'success') && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled')
    runs-on: instabox-medium
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: gh and jq
        run: |
          command -v gh >/dev/null && command -v jq >/dev/null && exit 0
          sudo apt-get update -q
          sudo apt-get install -y -q gh jq
      - name: write SHA256SUMS
        env:
          GH_TOKEN: ${{ github.token }}
        run: .github/scripts/checksums.sh "v$(jq -r .version mygo.json)" -R "$GITHUB_REPOSITORY"

  web-r2:
    if: github.ref == 'refs/heads/main' && (inputs.target == 'all' || inputs.target == 'web')
    runs-on: instabox-medium
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: build and upload to R2
        working-directory: web
        env:
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_PREFIX: ${{ secrets.R2_PREFIX }}
        run: |
          if [ -z "$R2_ENDPOINT" ] || [ -z "$R2_BUCKET" ] || [ -z "$R2_ACCESS_KEY_ID" ] || [ -z "$R2_SECRET_ACCESS_KEY" ]; then
            echo "::error::Set R2_ENDPOINT, R2_BUCKET, R2_ACCESS_KEY_ID and R2_SECRET_ACCESS_KEY"
            exit 1
          fi
          npm ci
          node build.mjs --ci
          node r2-upload.mjs
