name: Release

# Builds and signs every platform's app of mygo.json's version and uploads
# them to that version's draft GitHub release. macOS builds the Unix apps,
# whose archives keep the executable bit that a Windows file system loses;
# Windows builds its own, with the NSIS installer. The jobs run one after
# the other, as each merges its checksums into the release's SHA256SUMS.
on:
  workflow_dispatch:
    inputs:
      target:
        description: What to build
        type: choice
        options: [all, unix, windows]
        default: all

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  unix:
    if: github.ref == 'refs/heads/main' && inputs.target != 'windows'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: build and upload
        env:
          MYGO_UPDATER_PRIVATE_KEY: ${{ secrets.MYGO_UPDATER_PRIVATE_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: go tool mygo build -platform darwin/arm64,linux/amd64,linux/arm64 -upload

  windows:
    needs: unix
    if: always() && inputs.target != 'unix' && (needs.unix.result == 'success' || needs.unix.result == 'skipped')
    runs-on: windows-latest
    steps:
      # Keep LF in the files the app embeds, as the other platforms do.
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: build and upload
        shell: bash
        env:
          MYGO_UPDATER_PRIVATE_KEY: ${{ secrets.MYGO_UPDATER_PRIVATE_KEY }}
          MSYS2_ENV_CONV_EXCL: MYGO_UPDATER_PRIVATE_KEY
          MSYS_NO_PATHCONV: "1"
          GH_TOKEN: ${{ github.token }}
        run: go tool mygo build -platform windows/amd64,windows/arm64 -upload
