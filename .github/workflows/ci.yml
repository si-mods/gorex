name: CI

on:
  # Docs-only changes start no run; workflow_dispatch runs it by hand.
  # ios/WhatToTest.md stays in: the what-to-test step checks it. No other .md file is
  # an input to the code or the tests.
  pull_request:
    paths:
      - '**'
      - '!**.md'
      - '!docs/**'
      - 'ios/WhatToTest.md'
  push:
    branches: [main]
    paths:
      - '**'
      - '!**.md'
      - '!docs/**'
      - 'ios/WhatToTest.md'
  # For a commit that started no run: gh workflow run ci.yml --ref <branch>
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Not on main: a merge's run goes to its end once it starts.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # One job on one instabox machine (Ubuntu 24.04, 8 vCPU, 16 GiB). Every
  # instabox job that runs is one sandbox start, and the plan allows 500 a
  # day, 200 an hour and 30 a minute. Add steps to this job, not jobs. A job
  # that is skipped starts nothing. The machine lives for the job, a fork's
  # pull request too. Go caches are saved on pushes to main only; a pull
  # request restores them and saves none, so the 10 GB cache limit does not
  # fill with one copy per pull request.
  # Every step after plan runs even when an earlier one failed (!cancelled()),
  # so one failure does not hide the others; each failed step fails the job.
  # The Mac mini's runner takes one job at a time and is kept for the
  # release, so no job here waits for it.
  # Windows tests run on the self-hosted YIBO-PC runner (same-repo PRs and
  # pushes only); macOS-only issues still show on a developer's machine.
  # si-mods runs no job on GitHub's runners.
  linux:
    runs-on: instabox-large
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      # What this change reaches, from tools/ciplan: each changed file maps to
      # the packages that build, embed or read it, and every package whose
      # code or tests import one of those runs its tests. A file only the root
      # package's rule tests read (a .ts or .swift file, a workflow) runs just
      # those tests. A change only to docs or .md files runs nothing here. A
      # manual run, a new branch, a force-push, or a change to go.mod, go.sum,
      # the lint config, this file or tools/ciplan runs everything.
      - id: plan
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: go run ./tools/ciplan

      # What to Test comes from ios/WhatToTest.md, a bullet per locale, through
      # ios/scripts/test-notes: a pull request that changes what a tester sees
      # adds one, and one that reads like a commit subject fails. It runs on
      # every pull request, the iOS app's alone too.
      - name: what-to-test
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        # The script that judges the pull request comes from the base commit,
        # so the pull request cannot edit its own check. It reads the merge
        # commit (HEAD here) by SHA: the objects are shared.
        run: |
          TO=$(git rev-parse HEAD)
          git worktree add "$RUNNER_TEMP/base" "$BASE"
          "$RUNNER_TEMP/base/ios/scripts/test-notes" check "$BASE" "$TO"

      - uses: actions/cache/restore@v6
        if: ${{ !cancelled() && (steps.plan.outputs.go == 'true' || steps.plan.outputs.web_r2 == 'true') }}
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-ci-${{ hashFiles('go.sum') }}-${{ github.sha }}
          restore-keys: |
            go-ci-${{ hashFiles('go.sum') }}-
            go-ci-
      # The changed .go files; every tracked one when all runs.
      - name: gofmt
        if: ${{ !cancelled() && (steps.plan.outputs.all == 'true' || steps.plan.outputs.gofmt_files != '') }}
        env:
          ALL: ${{ steps.plan.outputs.all }}
          FILES: ${{ steps.plan.outputs.gofmt_files }}
        run: |
          if [ "$ALL" = true ]; then
            unformatted=$(git ls-files -z '*.go' | xargs -0 gofmt -l)
          else
            # shellcheck disable=SC2086
            unformatted=$(gofmt -l $FILES)
          fi
          if [ -n "$unformatted" ]; then
            echo "gofmt needed:"
            echo "$unformatted"
            exit 1
          fi
      # Each system's files and tests, in the packages whose .go files changed
      # and every package whose code or tests import one of them, so a change
      # that breaks an importer's darwin-only test still fails here.
      - name: vet
        if: ${{ !cancelled() && (steps.plan.outputs.vet_linux != '' || steps.plan.outputs.vet_windows != '' || steps.plan.outputs.vet_darwin != '') }}
        env:
          CGO_ENABLED: "0"
          VET_linux: ${{ steps.plan.outputs.vet_linux }}
          VET_windows: ${{ steps.plan.outputs.vet_windows }}
          VET_darwin: ${{ steps.plan.outputs.vet_darwin }}
        run: |
          status=0
          for os in linux windows darwin; do
            var="VET_$os"
            pkgs=${!var}
            [ -n "$pkgs" ] || continue
            echo "::group::$os"
            # shellcheck disable=SC2086
            GOOS=$os go vet $pkgs || status=1
            echo "::endgroup::"
          done
          exit $status
      - name: build
        if: ${{ !cancelled() && steps.plan.outputs.build == 'true' }}
        env:
          CGO_ENABLED: "0"
        run: |
          TAGS=$(grep -v '^#' packaging/ts-omit-tags.txt | grep -v '^$' | paste -sd, -)
          for t in linux/amd64 linux/arm64 windows/amd64 darwin/arm64; do
            echo "::group::$t"
            GOOS=${t%/*} GOARCH=${t#*/} GOFLAGS="-tags=$TAGS" go build ./...
            echo "::endgroup::"
          done
      - name: lint
        if: ${{ !cancelled() && steps.plan.outputs.lint != '' }}
        env:
          CGO_ENABLED: "0"
          PKGS: ${{ steps.plan.outputs.lint }}
        run: |
          # shellcheck disable=SC2086
          go run github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.15.0 run $PKGS

      # The web client's unit tests: its modules with no DOM, in Node
      # (web/test.mjs bundles web/test/*.test.ts and runs node --test). They
      # and the typecheck read web/ only. The web build itself needs Zig and
      # Ghostty, and is not run here.
      # The R2 upload below builds web/ too, on a push to main.
      - uses: actions/setup-node@v7
        if: ${{ !cancelled() && (steps.plan.outputs.web == 'true' || (steps.plan.outputs.web_r2 == 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main')) }}
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: web test
        if: ${{ !cancelled() && steps.plan.outputs.web == 'true' }}
        working-directory: web
        run: |
          npm ci
          npm run typecheck
          npm test

      # The Go tests, one after the other on the same box: the other
      # packages' -race run beside the root package's tests made timing tests
      # (TestDataSlowReader) fail on CPU load. Both run even if the first
      # fails. No retry: a failed test fails the step. The root package runs
      # in full when the change reaches it, or only its rule tests (root_run)
      # when only a file they read changed.
      - name: test
        if: ${{ !cancelled() && (steps.plan.outputs.root == 'true' || steps.plan.outputs.root_run != '' || steps.plan.outputs.test_linux != '') }}
        shell: bash
        env:
          ROOT: ${{ steps.plan.outputs.root }}
          ROOT_RUN: ${{ steps.plan.outputs.root_run }}
          PKGS: ${{ steps.plan.outputs.test_linux }}
        run: |
          root=0
          if [ "$ROOT" = true ] || [ -n "$ROOT_RUN" ]; then
            run=()
            [ "$ROOT" = true ] || run=(-test.run "$ROOT_RUN")
            go test -c -o "$RUNNER_TEMP/gorex.test" . &&
              "$RUNNER_TEMP/gorex.test" -test.timeout 15m "${run[@]}" || root=1
          fi
          others=0
          if [ -n "$PKGS" ]; then
            # shellcheck disable=SC2086
            go test -race $PKGS -count=1 -timeout 15m || others=1
          fi
          [ "$root" -eq 0 ] || echo "::error::root package tests failed"
          [ "$others" -eq 0 ] || echo "::error::other packages' tests failed"
          [ "$root" -eq 0 ] && [ "$others" -eq 0 ]
      - uses: actions/cache/save@v6
        if: ${{ !cancelled() && steps.plan.outputs.go == 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-ci-${{ hashFiles('go.sum') }}-${{ github.sha }}

      # Builds web/dist (with files.json) and uploads it to Cloudflare R2 on pushes to main.
      # Reuse the built ghostty-vt wasm: web/build.mjs skips the Zig build when
      # $GOREX_WEB_CACHE has it. The key holds the Ghostty commit, the Zig version
      # and a hash of build.mjs (which holds the build flags), so any change there
      # builds cold. Only the wasm file is cached, not the clone or the toolchain.
      - name: ghostty-vt wasm cache key
        id: wasm
        if: ${{ !cancelled() && steps.plan.outputs.web_r2 == 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        run: |
          commit=$(sed -n 's/^const COMMIT = "\([0-9a-f]*\)";/\1/p' web/build.mjs)
          zig=$(sed -n 's/^const ZIG_VERSION = "\([^"]*\)";/\1/p' web/build.mjs)
          [ -n "$commit" ] && [ -n "$zig" ] || { echo "::error::COMMIT or ZIG_VERSION not found in web/build.mjs"; exit 1; }
          {
            echo "cache=$RUNNER_TEMP/gorex-web"
            echo "file=$RUNNER_TEMP/gorex-web/ghostty-vt-${commit:0:12}.wasm"
            echo "key=ghostty-vt-$commit-zig-$zig-${{ hashFiles('web/build.mjs') }}"
          } >> "$GITHUB_OUTPUT"
      - name: ghostty-vt wasm cache
        if: ${{ !cancelled() && steps.plan.outputs.web_r2 == 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        uses: actions/cache@v6
        with:
          path: ${{ steps.wasm.outputs.file }}
          key: ${{ steps.wasm.outputs.key }}
      - name: build and upload to R2
        if: ${{ !cancelled() && steps.plan.outputs.web_r2 == 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        working-directory: web
        env:
          GOREX_WEB_CACHE: ${{ steps.wasm.outputs.cache }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_PREFIX: ${{ secrets.R2_PREFIX }}
        run: |
          if [ -z "$R2_ENDPOINT" ] || [ -z "$R2_BUCKET" ] || [ -z "$R2_ACCESS_KEY_ID" ] || [ -z "$R2_SECRET_ACCESS_KEY" ]; then
            echo "R2 secrets not configured; skipping upload"
            exit 0
          fi
          npm ci
          node build.mjs --ci
          node r2-upload.mjs

  test-windows:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, yibo-pc]
    timeout-minutes: 25
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      # The same plan as the linux job's (tools/ciplan).
      - id: plan
        shell: powershell
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          go run ./tools/ciplan
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      # Root UI integration tests take ~40m and hit Session 0 timing flakes on
      # yibo-pc, so CI runs only subpackages here (all of them take ~3.5m),
      # the ones the change reaches on Windows: ConPTY, session server, CLI,
      # rexapi and the Windows-specific subsystems.
      - name: test
        if: ${{ steps.plan.outputs.test_windows != '' }}
        shell: powershell
        env:
          CGO_ENABLED: "0"
          PKGS: ${{ steps.plan.outputs.test_windows }}
        run: |
          $pkgs = $env:PKGS -split ' '
          go test $pkgs -count=1 -timeout 15m
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
