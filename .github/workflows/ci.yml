name: CI

on:
  pull_request:
  push:
    branches: [main]
  # The Mac mini's tests for a branch: gh workflow run ci.yml --ref <branch>
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Not on main: a merge's run is the only one with its tests on macOS.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The Mac mini's runner, for the tests on macOS: on main, or when asked
  # for a branch, as it takes one job at a time and pull requests waited
  # for it. A pull request's tests run on Linux (test-linux), so what fails
  # on macOS alone shows after the merge. si-mods runs no job on GitHub's
  # runners. A fork's pull request runs its own copy of this file and could
  # name this runner: what bars its code from the Mac mini is the approval
  # each outside contributor's run needs. Read a fork's .github changes
  # before approving.
  test:
    if: github.event_name != 'pull_request'
    runs-on: [self-hosted, macmini]
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          # The runner keeps Go's caches between runs.
          cache: false
      - name: test
        run: go test ./... -count=1 -timeout 15m

  # One job, on an instabox machine (Ubuntu 24.04) that lives for the job:
  # it checks and cross-compiles each system's code, so it needs no Mac.
  build:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: instabox-medium
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        run: |
          unformatted=$(gofmt -l $(git ls-files '*.go'))
          if [ -n "$unformatted" ]; then
            echo "gofmt needed:"
            echo "$unformatted"
            exit 1
          fi
      # Each system's files and tests: build skips the tests, and a pull
      # request runs them on Linux only.
      - name: vet
        env:
          CGO_ENABLED: "0"
        run: |
          for os in linux windows darwin; do
            echo "::group::$os"
            GOOS=$os go vet ./...
            echo "::endgroup::"
          done
      - name: build
        env:
          CGO_ENABLED: "0"
        run: |
          for t in linux/amd64 linux/arm64 windows/amd64 darwin/arm64; do
            echo "::group::$t"
            GOOS=${t%/*} GOARCH=${t#*/} go build ./...
            echo "::endgroup::"
          done

  # The tests on Linux, on instabox machines: a pull request's only tests.
  # The root package's tests run one after another, so three machines take
  # a third each; a fourth runs the other packages. With build, that is
  # five at a time.
  test-linux:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: instabox-medium
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        part: [root-0, root-1, root-2, others]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      # Its own cache, as build's holds no compiled tests.
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-test-linux-${{ startsWith(matrix.part, 'root') && 'root' || 'others' }}-${{ hashFiles('go.sum') }}
          restore-keys: go-test-linux-${{ startsWith(matrix.part, 'root') && 'root' || 'others' }}-
      - name: test
        shell: bash
        env:
          PART: ${{ matrix.part }}
          # The number of root-N parts in the matrix.
          ROOT_PARTS: 3
        run: |
          if [ "$PART" = others ]; then
            pkgs=$(go list ./... | grep -v '^gorex$')
            go test $pkgs -count=1 -timeout 15m
            exit
          fi
          go test -c -o "$RUNNER_TEMP/gorex.test" .
          tests=$("$RUNNER_TEMP/gorex.test" -test.list '^(Test|Example|Fuzz)' |
            awk -v n="$ROOT_PARTS" -v i="${PART#root-}" 'NR % n == i' | paste -sd'|' -)
          [ -n "$tests" ]
          "$RUNNER_TEMP/gorex.test" -test.timeout 15m -test.run "^($tests)\$"
