name: CI

on:
  pull_request:
  push:
    branches: [main]
  # For a commit that started no run: gh workflow run ci.yml --ref <branch>
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Not on main: a merge's run goes to its end once it starts.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Every job runs on an instabox machine (Ubuntu 24.04) that lives for
  # the job, a fork's pull request too. The Mac mini's runner takes one job
  # at a time and is kept for the release, so no job here waits for it, and
  # the tests run on Linux only: what fails on macOS or Windows alone shows
  # on a developer's machine. si-mods runs no job on GitHub's runners.

  # gofmt and vet, and each system's code cross-compiled.
  build:
    runs-on: instabox-medium
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        run: |
          unformatted=$(gofmt -l $(git ls-files '*.go'))
          if [ -n "$unformatted" ]; then
            echo "gofmt needed:"
            echo "$unformatted"
            exit 1
          fi
      # Each system's files and tests: build skips the tests, and they run
      # on Linux only.
      - name: vet
        env:
          CGO_ENABLED: "0"
        run: |
          for os in linux windows darwin; do
            echo "::group::$os"
            GOOS=$os go vet ./...
            echo "::endgroup::"
          done
      - name: lint
        env:
          CGO_ENABLED: "0"
        run: go run github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.15.0 run ./...
      - name: build
        env:
          CGO_ENABLED: "0"
        run: |
          for t in linux/amd64 linux/arm64 windows/amd64 darwin/arm64; do
            echo "::group::$t"
            GOOS=${t%/*} GOARCH=${t#*/} go build ./...
            echo "::endgroup::"
          done

  # The web client's unit tests: its modules with no DOM, in Node
  # (web/test.mjs bundles web/test/*.test.ts and runs node --test). The
  # web build itself needs Zig and Ghostty, and is not run here.
  web:
    runs-on: instabox-medium
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: test
        working-directory: web
        run: |
          npm ci
          npm run typecheck
          npm test

  # The tests. The root package's tests run one after another, so three
  # machines take a third each; a fourth runs the other packages. With
  # build and web, that is six at a time.
  test-linux:
    runs-on: instabox-medium
    # Two runs of a part that hangs, at 15 minutes each.
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        part: [root-0, root-1, root-2, others]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      # Its own cache, as build's holds no compiled tests.
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-test-linux-${{ startsWith(matrix.part, 'root') && 'root' || 'others' }}-${{ hashFiles('go.sum') }}
          restore-keys: go-test-linux-${{ startsWith(matrix.part, 'root') && 'root' || 'others' }}-
      - name: test
        shell: bash
        env:
          PART: ${{ matrix.part }}
          # The number of root-N parts in the matrix.
          ROOT_PARTS: 3
        # All internal/* packages run with -race and no retry. Some root UI
        # tests still fail occasionally on shared runners, so root-* parts
        # retry once.
        run: |
          if [ "$PART" = others ]; then
            pkgs=$(go list ./... | grep -v '^gorex$')
            go test -race $pkgs -count=1 -timeout 15m
          else
            go test -c -o "$RUNNER_TEMP/gorex.test" .
            tests=$("$RUNNER_TEMP/gorex.test" -test.list '^(Test|Example|Fuzz)' |
              awk -v n="$ROOT_PARTS" -v i="${PART#root-}" 'NR % n == i' | paste -sd'|' -)
            [ -n "$tests" ]
            run() { "$RUNNER_TEMP/gorex.test" -test.timeout 15m -test.run "^($tests)\$"; }
            run || { echo "::warning::$PART failed, running it once more"; run; }
          fi

  # Builds web/dist (with files.json) and uploads it to Cloudflare R2 on pushes to main.
  web-r2:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: instabox-medium
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: build and upload to R2
        working-directory: web
        env:
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_PREFIX: ${{ secrets.R2_PREFIX }}
        run: |
          if [ -z "$R2_ENDPOINT" ] || [ -z "$R2_BUCKET" ] || [ -z "$R2_ACCESS_KEY_ID" ] || [ -z "$R2_SECRET_ACCESS_KEY" ]; then
            echo "R2 secrets not configured; skipping upload"
            exit 0
          fi
          npm ci
          node build.mjs --ci
          node r2-upload.mjs
