name: CI

on:
  # Docs-only changes start no run; workflow_dispatch runs it by hand.
  # ios/WhatToTest.md stays in: the what-to-test job checks it. No other .md file is
  # an input to the code or the tests.
  pull_request:
    paths:
      - '**'
      - '!**.md'
      - '!docs/**'
      - 'ios/WhatToTest.md'
  push:
    branches: [main]
    paths:
      - '**'
      - '!**.md'
      - '!docs/**'
      - 'ios/WhatToTest.md'
  # For a commit that started no run: gh workflow run ci.yml --ref <branch>
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Not on main: a merge's run goes to its end once it starts.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Most jobs run on an instabox machine (Ubuntu 24.04) that lives for
  # the job, a fork's pull request too. Go caches are saved on pushes to
  # main only; a pull request restores them and saves none, so the 10 GB
  # cache limit does not fill with one copy per pull request.
  # The Mac mini's runner takes one job at a time and is kept for the
  # release, so no job here waits for it.
  # Windows tests run on the self-hosted YIBO-PC runner (same-repo PRs and
  # pushes only); macOS-only issues still show on a developer's machine.
  # si-mods runs no job on GitHub's runners.

  # Whether the change reaches past the iOS app. A change only to the
  # Swift app (IOS_ONLY: its sources, tests, packages, scripts and
  # project), docs, .md files or the TestFlight workflow runs only
  # what-to-test here: the TestFlight workflow builds the app when it
  # reaches main. Everything else runs all jobs, a new path too: ios/share
  # and ios/tailnet are Go, and Go's tests and the web build read the files
  # in READ_ELSEWHERE. An empty diff, a manual run, and a base that is not
  # an ancestor (a new branch, a force-push) run all.
  changes:
    runs-on: instabox-medium
    timeout-minutes: 5
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: diff
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          IOS_ONLY: '^(ios/(GoRex|GoRexTests|SherpaOnnx|scripts)/|ios/(project\.yml|\.gitignore)$|docs/|\.github/workflows/testflight\.yml$)|\.md$'
          READ_ELSEWHERE: '^ios/GoRex/(Rex/RexProtocol\.gen\.swift|ghostty-themes\.json)$'
        run: |
          code=true
          if [ "$GITHUB_EVENT_NAME" != workflow_dispatch ] && git merge-base --is-ancestor "$BASE" HEAD 2>/dev/null; then
            files=$(git diff --name-only "$BASE" HEAD)
            if [ -n "$files" ] &&
              ! printf '%s\n' "$files" | grep -Ev "$IOS_ONLY" | grep -q . &&
              ! printf '%s\n' "$files" | grep -Eq "$READ_ELSEWHERE"; then
              code=false
            fi
          fi
          echo "code=$code" | tee -a "$GITHUB_OUTPUT"

  # What to Test comes from ios/WhatToTest.md, a bullet per locale, through
  # ios/scripts/test-notes: a pull request that changes what a tester sees
  # adds one, and one that reads like a commit subject fails. It runs on
  # every pull request, the iOS app's alone too.
  what-to-test:
    if: github.event_name == 'pull_request'
    runs-on: instabox-medium
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: ios/WhatToTest.md
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        # The script that judges the pull request comes from the base commit,
        # so the pull request cannot edit its own check. It reads the merge
        # commit (HEAD here) by SHA: the objects are shared.
        run: |
          TO=$(git rev-parse HEAD)
          git worktree add "$RUNNER_TEMP/base" "$BASE"
          "$RUNNER_TEMP/base/ios/scripts/test-notes" check "$BASE" "$TO"

  # gofmt and vet, and each system's code cross-compiled. It runs on the
  # large box (8 vCPU, 16 GiB), as vet and lint compile everything.
  build:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: instabox-large
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/cache/restore@v6
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-build-${{ hashFiles('go.sum') }}-${{ github.sha }}
          restore-keys: |
            go-build-${{ hashFiles('go.sum') }}-
            go-build-
      - name: gofmt
        run: |
          unformatted=$(git ls-files -z '*.go' | xargs -0 gofmt -l)
          if [ -n "$unformatted" ]; then
            echo "gofmt needed:"
            echo "$unformatted"
            exit 1
          fi
      # Each system's files and tests: build skips the tests, and they run
      # on Linux only.
      - name: vet
        env:
          CGO_ENABLED: "0"
        run: |
          for os in linux windows darwin; do
            echo "::group::$os"
            GOOS=$os go vet ./...
            echo "::endgroup::"
          done
      - name: lint
        env:
          CGO_ENABLED: "0"
        run: go run github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.15.0 run ./...
      - name: build
        env:
          CGO_ENABLED: "0"
        run: |
          TAGS=$(grep -v '^#' packaging/ts-omit-tags.txt | grep -v '^$' | paste -sd, -)
          for t in linux/amd64 linux/arm64 windows/amd64 darwin/arm64; do
            echo "::group::$t"
            GOOS=${t%/*} GOARCH=${t#*/} GOFLAGS="-tags=$TAGS" go build ./...
            echo "::endgroup::"
          done
      - uses: actions/cache/save@v6
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-build-${{ hashFiles('go.sum') }}-${{ github.sha }}

  # The web client's unit tests: its modules with no DOM, in Node
  # (web/test.mjs bundles web/test/*.test.ts and runs node --test). The
  # web build itself needs Zig and Ghostty, and is not run here.
  web:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: instabox-medium
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: test
        working-directory: web
        run: |
          npm ci
          npm run typecheck
          npm test

  # The tests. The root package's tests run one after another, so three
  # machines take a third each; a fourth runs the other packages. With
  # build and web, that is five at a time.
  test-linux:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: instabox-medium
    # One run of a part that hangs, at 15 minutes, and the setup.
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        part: [root-0, root-1, root-2, others]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      # Its own cache, as build's holds no compiled tests.
      - uses: actions/cache/restore@v6
        id: cache
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-test-linux-${{ startsWith(matrix.part, 'root') && 'root' || 'others' }}-${{ hashFiles('go.sum') }}-${{ github.sha }}
          restore-keys: |
            go-test-linux-${{ startsWith(matrix.part, 'root') && 'root' || 'others' }}-${{ hashFiles('go.sum') }}-
            go-test-linux-${{ startsWith(matrix.part, 'root') && 'root' || 'others' }}-
      - name: test
        shell: bash
        env:
          PART: ${{ matrix.part }}
          # The number of root-N parts in the matrix.
          ROOT_PARTS: 3
        # No part retries: a failed test fails the job.
        run: |
          if [ "$PART" = others ]; then
            mapfile -t pkgs < <(go list ./... | grep -v '^gorex$')
            go test -race "${pkgs[@]}" -count=1 -timeout 15m
          else
            go test -c -o "$RUNNER_TEMP/gorex.test" .
            tests=$("$RUNNER_TEMP/gorex.test" -test.list '^(Test|Example|Fuzz)' |
              awk -v n="$ROOT_PARTS" -v i="${PART#root-}" 'NR % n == i' | paste -sd'|' -)
            [ -n "$tests" ]
            "$RUNNER_TEMP/gorex.test" -test.timeout 15m -test.run "^($tests)\$"
          fi
      # root-0, root-1 and root-2 share one key, so root-0 saves for them.
      - uses: actions/cache/save@v6
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && (matrix.part == 'root-0' || matrix.part == 'others')
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ steps.cache.outputs.cache-primary-key }}

  test-windows:
    needs: changes
    if: needs.changes.outputs.code == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: [self-hosted, yibo-pc]
    timeout-minutes: 25
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      # Root UI integration tests take ~40m and hit Session 0 timing flakes on
      # yibo-pc, so CI runs all subpackages here (~3.5m) which cover ConPTY,
      # session server, CLI, rexapi, and Windows-specific subsystems.
      - name: test
        shell: powershell
        env:
          CGO_ENABLED: "0"
        run: |
          $pkgs = go list ./... | Where-Object { $_ -ne 'gorex' }
          go test $pkgs -count=1 -timeout 15m
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  # Builds web/dist (with files.json) and uploads it to Cloudflare R2 on pushes to main.
  web-r2:
    needs: changes
    if: needs.changes.outputs.code == 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: instabox-medium
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      # Build's cache, restored only: this job saves none.
      - uses: actions/cache/restore@v6
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-build-${{ hashFiles('go.sum') }}-${{ github.sha }}
          restore-keys: |
            go-build-${{ hashFiles('go.sum') }}-
            go-build-
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      # Reuse the built ghostty-vt wasm: web/build.mjs skips the Zig build when
      # $GOREX_WEB_CACHE has it. The key holds the Ghostty commit, the Zig version
      # and a hash of build.mjs (which holds the build flags), so any change there
      # builds cold. Only the wasm file is cached, not the clone or the toolchain.
      - name: ghostty-vt wasm cache key
        id: wasm
        run: |
          commit=$(sed -n 's/^const COMMIT = "\([0-9a-f]*\)";/\1/p' web/build.mjs)
          zig=$(sed -n 's/^const ZIG_VERSION = "\([^"]*\)";/\1/p' web/build.mjs)
          [ -n "$commit" ] && [ -n "$zig" ] || { echo "::error::COMMIT or ZIG_VERSION not found in web/build.mjs"; exit 1; }
          {
            echo "cache=$RUNNER_TEMP/gorex-web"
            echo "file=$RUNNER_TEMP/gorex-web/ghostty-vt-${commit:0:12}.wasm"
            echo "key=ghostty-vt-$commit-zig-$zig-${{ hashFiles('web/build.mjs') }}"
          } >> "$GITHUB_OUTPUT"
      - name: ghostty-vt wasm cache
        uses: actions/cache@v6
        with:
          path: ${{ steps.wasm.outputs.file }}
          key: ${{ steps.wasm.outputs.key }}
      - name: build and upload to R2
        working-directory: web
        env:
          GOREX_WEB_CACHE: ${{ steps.wasm.outputs.cache }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_PREFIX: ${{ secrets.R2_PREFIX }}
        run: |
          if [ -z "$R2_ENDPOINT" ] || [ -z "$R2_BUCKET" ] || [ -z "$R2_ACCESS_KEY_ID" ] || [ -z "$R2_SECRET_ACCESS_KEY" ]; then
            echo "R2 secrets not configured; skipping upload"
            exit 0
          fi
          npm ci
          node build.mjs --ci
          node r2-upload.mjs
