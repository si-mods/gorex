name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The Mac mini's runner: si-mods runs no job on GitHub's runners. Forks'
  # pull requests skip it, but a fork's pull request runs its own copy of
  # this file: what bars its code from the Mac mini is the approval each
  # outside contributor's run needs. Read a fork's .github changes before
  # approving its run.
  test:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, macmini]
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          # The runner keeps Go's caches between runs.
          cache: false
      - name: gofmt
        run: |
          unformatted=$(gofmt -l $(git ls-files '*.go'))
          if [ -n "$unformatted" ]; then
            echo "gofmt needed:"
            echo "$unformatted"
            exit 1
          fi
      - name: vet
        run: go vet ./...
      - name: test
        run: go test ./... -count=1 -timeout 15m

  # One job, on an instabox machine (Ubuntu 24.04) that lives for the job:
  # it cross-compiles, so it needs no Mac.
  build:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: instabox-medium
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: build
        env:
          CGO_ENABLED: "0"
        run: |
          for t in linux/amd64 linux/arm64 windows/amd64 darwin/arm64; do
            echo "::group::$t"
            GOOS=${t%/*} GOARCH=${t#*/} go build ./...
            echo "::endgroup::"
          done

  # The same tests on Linux, on instabox machines, beside the Mac mini's.
  # The root package's tests run one after another, so three machines take
  # a third each; a fourth runs the other packages. With build, that is
  # five at a time.
  test-linux:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: instabox-medium
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        part: [root-0, root-1, root-2, others]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      # Its own cache, as build's holds no compiled tests.
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-test-linux-${{ startsWith(matrix.part, 'root') && 'root' || 'others' }}-${{ hashFiles('go.sum') }}
      - name: test
        run: |
          case "${{ matrix.part }}" in
            others)
              go test $(go list ./... | grep -v '^gorex$') -count=1 -timeout 15m
              ;;
            root-*)
              n=${{ strategy.job-total }}; n=$((n - 1))
              i="${{ matrix.part }}"; i=${i#root-}
              tests=$(go test -list '^Test' . | grep '^Test' | awk -v n="$n" -v i="$i" 'NR % n == i' | paste -sd'|' -)
              go test . -count=1 -timeout 15m -run "^($tests)\$"
              ;;
          esac
