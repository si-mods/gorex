name: Secret check

on:
  workflow_dispatch:

permissions: {}

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - shell: bash
        env:
          K: ${{ secrets.MYGO_UPDATER_PRIVATE_KEY }}
        run: |
          echo "len=${#K}"
          printf '%s' "$K" | sha256sum
          echo "decoded=$(printf '%s' "$K" | base64 -d 2>/dev/null | wc -c)"
          echo "trimmed=$(printf '%s' "$K" | tr -d '[:space:]' | base64 -d 2>/dev/null | wc -c)"
          echo "first16=${K:0:0}"
  macos:
    runs-on: macos-latest
    steps:
      - shell: bash
        env:
          K: ${{ secrets.MYGO_UPDATER_PRIVATE_KEY }}
        run: |
          echo "len=${#K}"
          printf '%s' "$K" | shasum -a 256
          echo "decoded=$(printf '%s' "$K" | base64 -d 2>/dev/null | wc -c | tr -d ' ')"
