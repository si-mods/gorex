name: Delete shots

# A merged PR's screenshots branch, shots/pr-<number>, is deleted: the repo
# is public, and the shots are for the review. A PR without one is a no-op.
# pull_request_target runs from main and checks nothing out.

on:
  pull_request_target:
    types: [closed]
    branches: [main]

permissions:
  contents: write

jobs:
  delete:
    if: github.event.pull_request.merged
    runs-on: instabox-medium
    timeout-minutes: 10
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          REF: heads/shots/pr-${{ github.event.pull_request.number }}
        run: |
          api() { curl -sS -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $GH_TOKEN" "$@"; }
          if [ "$(api "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/git/ref/$REF")" = 200 ]; then
            [ "$(api -X DELETE "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/git/refs/$REF")" = 204 ]
            echo "Deleted $REF" >> "$GITHUB_STEP_SUMMARY"
          fi
