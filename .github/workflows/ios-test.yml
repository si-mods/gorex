name: iOS test

# Builds Rex Go and runs its unit tests (GoRexTests) for any branch, tag or
# commit, on the Mac mini's runner. It uploads nothing and uses no secret.
# Start it by hand; this file runs from main:
#   gh workflow run ios-test.yml -R si-mods/gorex --ref main -f ref=<branch>
on:
  workflow_dispatch:
    inputs:
      ref:
        description: The branch, tag or SHA to test
        required: true
        type: string
      only:
        description: "An -only-testing value, such as GoRexTests/ConnectionTests"
        required: false
        type: string

permissions:
  contents: read

# A group for each ref: GitHub keeps one pending run in a group and
# cancels an older one, so one shared group dropped other branches' runs.
# Runs of different refs wait for the runner instead.
concurrency:
  group: ios-test-${{ inputs.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  test:
    # The Mac mini's own runner, as testflight.yml uses.
    runs-on: gorex-testflight
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 1
      # The deployment target is iOS 26: the newest Xcode_26*, as GitHub's
      # images name them, else the Mac's own; DEVELOPER_DIR, as xcode-select
      # needs sudo.
      - run: |
          shopt -s nullglob
          x=$(printf '%s\n' /Applications/Xcode_26*.app | sort -V | tail -1)
          [[ -z $x ]] || echo "DEVELOPER_DIR=$x/Contents/Developer" >> "$GITHUB_ENV"
      - run: xcodebuild -version
      - run: command -v xcodegen >/dev/null || brew install xcodegen
      # ios/project.yml's minimumXcodeGenVersion: the Icon Composer icons
      # (.icon folders) need 2.45.1; an older xcodegen the Mac kept upgrades.
      - run: |
          v=$(xcodegen --version | grep -Eo '[0-9]+(\.[0-9]+)+' | head -1)
          [[ $(printf '%s\n' 2.45.1 "$v" | sort -V | head -1) == 2.45.1 ]] || brew upgrade xcodegen
      # Built-in Tailscale (ios/tailnet), with the Go and gomobile go.mod pins.
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          # The runner keeps Go's caches between runs; a saved copy took
          # 7 GB of the repository's 10 GB Actions cache.
          cache: false
      - uses: actions/cache/restore@v6
        id: tailnet
        with:
          path: ios/Frameworks/Tailnet.xcframework
          key: tailnet-${{ hashFiles('go.mod', 'go.sum', 'ios/tailnet/**', 'internal/tailnode/**', 'ios/scripts/build-tailnet') }}
      - if: steps.tailnet.outputs.cache-hit != 'true'
        run: ios/scripts/build-tailnet
      - if: steps.tailnet.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ios/Frameworks/Tailnet.xcframework
          key: ${{ steps.tailnet.outputs.cache-primary-key }}
      - name: test
        working-directory: ios
        env:
          ONLY: ${{ inputs.only }}
        run: |
          xcodegen generate -q
          mkdir -p build
          # The packages, GhosttyKit's binaries from GitHub among them: a
          # download GitHub fails (a 504 at times) is tried again.
          for n in 1 2 3; do
            xcodebuild -resolvePackageDependencies -scheme GoRex > build/resolve.log 2>&1 && break
            grep -E "error|failed" build/resolve.log | tail -5 || true
            [[ $n -lt 3 ]] || exit 1
            sleep $((n * 30))
          done
          xcrun simctl list devices available -j > build/devices.json
          UDID=$(python3 -I -c '
          import json, re, sys
          best = None
          for rt, devs in json.load(open("build/devices.json"))["devices"].items():
              m = re.search(r"iOS-(\d+(?:-\d+)*)$", rt)
              if not m:
                  continue
              ver = tuple(int(x) for x in m.group(1).split("-"))
              for d in devs:
                  if d["name"].startswith("iPhone") and d.get("isAvailable", True):
                      if best is None or ver > best[0]:
                          best = (ver, d["udid"])
          print(best[1] if best else "")
          ')
          [[ -n $UDID ]] || { echo "::error::No available iPhone simulator"; exit 1; }
          A=(-scheme GoRex -destination "platform=iOS Simulator,id=$UDID" CODE_SIGNING_ALLOWED=NO -resultBundlePath build/test.xcresult)
          [[ -z $ONLY ]] || A+=("-only-testing:$ONLY")
          rm -rf build/test.xcresult
          rc=0
          xcodebuild test "${A[@]}" > build/test.log 2>&1 || rc=$?
          {
            if [[ $rc -eq 0 ]]; then echo "### iOS tests passed"; else echo "### iOS tests failed"; fi
            echo
            echo "Tested \`$(git rev-parse HEAD)\`${ONLY:+, only \`$ONLY\`}"
            if [[ $rc -ne 0 ]]; then
              echo
              echo '```'
              grep -E "error:|Test Case .* failed|\*\* TEST FAILED" build/test.log | sort -u | head -50 || true
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          tail -5 build/test.log
          exit "$rc"
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: xcodebuild-logs
          path: |
            ios/build/*.log
            ios/build/test.xcresult
          if-no-files-found: ignore
