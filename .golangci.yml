version: "2"

linters:
  default: none
  enable:
    - bodyclose
    - copyloopvar
    - durationcheck
    - errname
    - forbidigo
    - govet
    - ineffassign
    - staticcheck
    - unconvert
  settings:
    forbidigo:
      forbid:
        - pattern: ^os\.Exit$
          msg: "os.Exit is restricted to entrypoints (main.go, tools/, internal/rexproto/gen.go)"
    staticcheck:
      checks:
        - all
        - "-QF*"
        - "-ST1*"
        - "-SA1019"
  exclusions:
    rules:
      # Intentional lock-drain barriers (acquire and immediately release mutex).
      - path: internal/rex/(server|remote_test)\.go$
        text: "SA2001:"
      # Intentional entrypoints / generated helpers / Windows self-upgrade exit / TestMain.
      - path: ^(main\.go|tools/|internal/rexproto/gen\.go|internal/rex/upgrade_windows\.go)|_test\.go$
        linters:
          - forbidigo
